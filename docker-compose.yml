services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sale_ai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=sale-ai-production-secret-key-2026
      - DEBUG=False
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-flash
      - ADMIN_NOTIFICATION_EMAIL=${ADMIN_NOTIFICATION_EMAIL:-admin@sale-ai.vn}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@sale-ai.vn}
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
    volumes:
      - db_data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sale_ai_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
